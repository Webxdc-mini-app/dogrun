<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ドッグラン</title>
<style>
:root{color-scheme:light dark;--bg:#f3f0e6;--card:#fff;--ink:#2b2118;--sub:#7a6c5d;--blue:#2b5fd9;--red:#e0334c;--line:#e3d8c6;--g1:#e8f5d8;--g2:#cde8b5;--g3:#a8c686;font-family:ui-rounded,"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#161a14;--card:#232a20;--ink:#eef2e6;--sub:#a3ad96;--line:#38422f;--g1:#2f4d30;--g2:#27432b;--g3:#1d3322}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);padding:max(12px,env(safe-area-inset-top)) 12px 24px;line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 10px;min-height:40px}
h1{font-size:1.25rem;margin:0}h1 small{font-size:.7rem;color:var(--sub);margin-left:4px}h2{font-size:1.1rem;margin:0 0 6px}
.sub{color:var(--sub)}small{font-size:.78rem}
button{font:inherit;border:0;border-radius:999px;padding:.55em 1.1em;background:var(--ink);color:var(--bg);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
#park{position:relative;height:min(52vh,430px);min-height:300px;border-radius:24px;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,var(--g1) 0%,var(--g2) 40%,var(--g3) 100%);box-shadow:0 0 0 1.5px var(--line)}
#park::before{content:"";position:absolute;inset:10px;border-radius:18px;border:3px dashed #8b735566;pointer-events:none}
.obj{position:absolute;transform:translate(-50%,-50%);text-align:center;pointer-events:none;font-size:2rem;line-height:1.1;filter:drop-shadow(0 4px 4px #0003)}
.obj small{display:block;font-size:.62rem;font-weight:700;background:#fffc;color:#2b2118;border-radius:99px;padding:0 .5em;margin-top:2px}
button#mb{position:absolute;right:12px;top:10px;z-index:99999;background:transparent;color:inherit;font-size:2rem;padding:2px 8px;line-height:1.2}
#empty{position:absolute;inset:45% 0 auto;text-align:center;margin:0;color:var(--sub)}
.badge{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;border-radius:999px;font-size:.72rem;padding:.05em .5em;line-height:1.4}
#mb .badge{top:0;right:0}
.pet{position:absolute;left:0;top:0;width:110px;transform-origin:50% 100%;cursor:pointer;will-change:transform;-webkit-tap-highlight-color:transparent}
.pet svg{display:block;width:110px;height:auto;overflow:visible}
.pet .badge{top:0;right:8px}
.shadow{position:absolute;left:16%;right:16%;bottom:-3px;height:11px;border-radius:50%;background:#0003;filter:blur(2px)}
.tag{position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:.72rem;background:var(--card);padding:.05em .6em;border-radius:99px;margin-top:4px;box-shadow:0 0 0 1px var(--line)}
.pet.mine .tag{box-shadow:0 0 0 2px var(--blue)}.pet.sel .tag{background:var(--ink);color:var(--bg)}
.bub{position:absolute;top:-16px;left:50%;margin-left:-.5em;font-size:1.1rem;animation:float 2s ease-in-out infinite}
.speech{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#2b2118;font-size:.78rem;font-weight:700;padding:.2em .8em;border-radius:14px;box-shadow:0 2px 6px #0003;margin-bottom:-6px;z-index:5}
.speech::after{content:"";position:absolute;left:50%;top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:#fff}
#roster{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 4px}
button.chip{background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line);border-radius:16px;padding:3px 12px 3px 4px;display:flex;align-items:center;gap:6px;flex:none;font-size:.85rem}
button.chip.on{box-shadow:0 0 0 2.5px var(--blue)}button.chip.home{opacity:.6}
.chip svg{width:38px;height:auto}.chip .pa *{animation:none!important}
.panel{background:var(--card);border-radius:20px;padding:12px;margin-top:8px;box-shadow:0 0 0 1.5px var(--line)}
.ph{display:flex;gap:10px;align-items:center;margin-bottom:8px}.ph svg{width:56px;height:auto;flex:none}.ph .pa *{animation:none!important}
.pill{font-size:.68rem;font-weight:700;border-radius:99px;padding:.05em .6em;background:var(--ink);color:var(--bg)}
.stat{display:grid;grid-template-columns:52px 1fr 26px;gap:6px;align-items:center;font-size:.68rem;font-weight:700;margin:3px 0}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;transition:width .6s}
.stat b{text-align:right;font-weight:400;color:var(--sub)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.acts button{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:14px;padding:.5em .2em;font-size:.78rem;line-height:1.3}
.acts button span{display:block;font-size:1.2rem}.acts button small{display:block;color:var(--sub);font-size:.62rem}
/* 犬の動き */
.pa .body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
.pa .hd{transform-origin:60px 82px;animation:headbob 3.2s ease-in-out infinite}
.pa .tail{animation:wag .45s ease-in-out infinite alternate}
.pa.sleepy .tail,.pa.hungry .tail{animation-duration:2.6s}
.pa .ear{animation:twitch 6s var(--d) infinite}
.pa .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s var(--d) infinite}
.pa .arm{transform-box:fill-box;transform-origin:50% 0}
.pa.hungry .body{animation:gurgle .5s infinite}.pa.sleepy .hd{animation:doze 4s ease-in-out infinite}.pa.lonely .hd{animation:sulk 5s ease-in-out infinite}
.pa.lonely .ear{animation:none;transform:rotate(12deg)}.pa.lonely .tail{animation:none;transform:rotate(25deg)}
.pa .z{animation:zz 3s ease-out infinite;font-size:13px;fill:var(--ink);opacity:0}.pa .tear{animation:tear 2.2s infinite}
.walk .hop{animation:hop .4s ease-in-out infinite}.run .hop{animation-duration:.28s}
.walk .arm.l{animation:swing .4s ease-in-out infinite alternate}.walk .arm.r{animation:swing .4s ease-in-out infinite alternate-reverse}
.walk .ft1{animation:step .4s infinite alternate}.walk .ft2{animation:step .4s infinite alternate-reverse}
.jump .act{animation:jump .8s}.squish .act{animation:squish .6s}.eat .hd{animation:nod .35s 4}.bark .act{animation:jump .35s 2}
.fx{position:absolute;z-index:99998;pointer-events:none;font-size:1.4rem;margin-left:-.6em}
.heart{animation:rise 1.6s ease-out forwards}.drop{animation:dropin .8s cubic-bezier(.3,0,.8,1) forwards;font-size:1.9rem}.pop{animation:popup 1.4s ease-out forwards;font-size:2rem}
@keyframes breathe{50%{transform:scale(1.03,1.05)}}@keyframes headbob{50%{transform:translateY(1.6px) rotate(-1deg)}}
@keyframes wag{from{transform:rotate(-12deg)}to{transform:rotate(18deg)}}
@keyframes twitch{0%,90%,100%{transform:none}93%{transform:rotate(-8deg)}96%{transform:rotate(5deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes swing{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}@keyframes step{to{transform:translateY(-4px)}}
@keyframes hop{50%{transform:translateY(-6px)}}@keyframes float{50%{transform:translateY(-5px)}}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(9px,-16px)}}
@keyframes doze{50%{transform:rotate(6deg) translateY(3px)}}@keyframes gurgle{25%{transform:scale(1.05,.96)}75%{transform:scale(.97,1.04)}}
@keyframes tear{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(14px)}}
@keyframes sulk{50%{transform:translateY(3px)}}@keyframes nod{50%{transform:translateY(5px) rotate(4deg)}}
@keyframes jump{30%{transform:translateY(-26px)}50%{transform:scale(1.08,.9)}70%{transform:translateY(-12px)}}
@keyframes squish{30%{transform:scale(1.15,.8)}60%{transform:scale(.92,1.1)}}
@keyframes rise{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-70px) scale(1.2)}}
@keyframes dropin{from{transform:translateY(-120px)}to{transform:translateY(0)}}
@keyframes popup{0%{transform:scale(0)}30%{transform:scale(1.3)}100%{opacity:0;transform:translateY(-40px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
dialog{border:0;border-radius:24px;padding:18px;width:min(420px,92vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
.row,.pick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
input,textarea,select{font:inherit;width:100%;padding:.6em .8em;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);margin:6px 0}
button.opt{background:var(--bg);color:var(--ink);border-radius:16px;padding:6px;width:84px;font-size:.72rem;line-height:1.3}button.opt svg{width:100%;height:auto}button.opt .pa *{animation:none!important}
button.opt.on,button.pr.on{box-shadow:0 0 0 3px var(--blue)}button.pr{background:var(--bg);color:var(--ink);font-size:.8rem}
.air{padding:12px 14px;margin:12px 0;border:7px solid transparent;border-image:repeating-linear-gradient(135deg,var(--red) 0 10px,var(--card) 10px 20px,var(--blue) 20px 30px,var(--card) 30px 40px) 7;background:var(--bg)}
.air p{margin:6px 0;white-space:pre-wrap;word-break:break-word}
.from{display:flex;align-items:center;gap:8px}.from svg{width:48px;height:auto;flex:none}.from .pa *{animation:none!important}
</style></head><body>
<div id="app"><header><h1>ドッグラン<small>Dog Run</small></h1><span id="hb"></span></header>
<div id="park"><button id="mb" data-a="inbox" aria-label="手紙">📮<b class="badge" hidden></b></button><p id="empty">まだ犬がいないよ。<br>「+ 新しい犬」から迎えよう！</p></div>
<p><button class="ghost" data-a="backup">データ引き継ぎ</button> <small>v1.1.1</small></p><div id="roster"></div><div id="panel"></div></div>
<dialog id="dlg"></dialog>
<script src="webxdc.js"></script>
<script>
// Shared API always takes priority. Standalone local files can run an isolated demo.
const sharedAPI=window.webxdc&&typeof window.webxdc.sendUpdate==='function'&&typeof window.webxdc.setUpdateListener==='function';
const demoMode=!sharedAPI&&(location.protocol==='file:'||new URLSearchParams(location.search).get('demo')==='1');
let demoPersistent=true;
function createDemo(){
  const key='dogrun-browser-demo-v1',roleKey='dogrun-browser-demo-role';
  let role='a';try{role=sessionStorage.getItem(roleKey)||'a'}catch{}role=role==='b'?'b':'a';
  let data;try{data=JSON.parse(localStorage.getItem(key)||'null')}catch{demoPersistent=false}
  if(!Array.isArray(data)){
    const t=Date.now();data=[
      {a:'adopt',id:'demo-coco',name:'ココ',breed:'柴犬',pers:'やんちゃ',on:'あおい',o:'demo-a',t:t-3000,k:'demo-adopt-a'},
      {a:'adopt',id:'demo-marron',name:'マロン',breed:'コーギー',pers:'おっとり',on:'さくら',o:'demo-b',t:t-2000,k:'demo-adopt-b'},
      {a:'mail',from:'demo-marron',to:'demo-coco',kind:'letter',text:'いっしょに遊ぼう！これはデモのお手紙です。',on:'さくら',o:'demo-b',t:t-1000,k:'demo-letter'}];
  }
  const save=()=>{try{localStorage.setItem(key,JSON.stringify(data))}catch{demoPersistent=false}};save();
  let listener,n=0;const pump=()=>{while(listener&&n<data.length){listener({payload:data[n],serial:++n,max_serial:data.length})}};
  addEventListener('storage',e=>{if(e.key!==key)return;try{const next=JSON.parse(e.newValue||'null');if(Array.isArray(next)){data=next;pump()}}catch{}});
  const controls=document.createElement('div');controls.innerHTML='<label>デモの操作役 <select id="demoRole"><option value="a">あおい（ココの飼い主）</option><option value="b">さくら（マロンの飼い主）</option></select></label><button class="ghost" id="demoReset">デモを最初から</button>';
  document.querySelector('header').after(controls);controls.querySelector('select').value=role;
  controls.querySelector('select').onchange=e=>{try{sessionStorage.setItem(roleKey,e.target.value)}catch{connectionError('このブラウザーでは操作役を保存できません。保存を許可してから切り替えてください。');return}location.reload()};
  controls.querySelector('button').onclick=()=>{if(confirm('このブラウザーに保存したデモの犬と手紙を初期状態に戻しますか？')){try{localStorage.removeItem(key);localStorage.removeItem('dr-demo-read')}catch{}location.reload()}};
  return {selfAddr:'demo-'+role,selfName:role==='a'?'あおい':'さくら',sendUpdate(u){try{const stored=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(stored))data=stored}catch{}data.push(u.payload);save();pump()},setUpdateListener(f){listener=f;pump();return Promise.resolve()},sendToChat:async message=>{const blob=new Blob([message.file.plainText],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=message.file.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}};
}
const W=sharedAPI?window.webxdc:demoMode?createDemo():null;
function connectionError(message){
  let el=document.getElementById('connection');
  if(!el){el=document.createElement('p');el.id='connection';el.setAttribute('role','status');(document.querySelector('header')||document.getElementById('app')).after(el)}
  el.textContent=message;
}
if(!W || typeof W.sendUpdate!=='function' || typeof W.setUpdateListener!=='function'){
  document.getElementById('app').replaceChildren();
  connectionError('共有機能を読み込めませんでした。Delta Chatのチャットに投稿したアプリから開き直してください。');
  const demoLink=document.createElement('a');const demoURL=new URL(location.href);demoURL.searchParams.set('demo','1');demoLink.href=demoURL.href;demoLink.textContent='ブラウザーのデモを開く（チャットには共有されません）';document.getElementById('connection').after(demoLink);
  throw new Error('webxdc API unavailable: shared mode required');
}
connectionError(demoMode?'ブラウザーデモを準備しています…':'共有データを読み込んでいます…');
const me=W.selfAddr,myName=W.selfName,$=s=>document.querySelector(s),dlg=$('#dlg'),rnd=Math.random;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
// ---- 犬種・性格・お届け物・公園の設備 ----
const BR={'柴犬':{col:'#D88C3A',ear:'point',tail:'curl',patch:'cheek'},'秋田犬':{col:'#9a6a3a',ear:'point',tail:'curl',patch:'mask',sz:1.1},
 'コーギー':{col:'#E8A75D',ear:'big',tail:'stub',patch:'blaze'},'ダルメシアン':{col:'#f2f2f2',ear:'flop',tail:'long',patch:'spots',ec:'#3a3a3a'},
 'ポメラニアン':{col:'#FFB088',ear:'small',tail:'plume',patch:'fluff',sz:.9},'黒ラブ':{col:'#55555f',ear:'flop',tail:'otter',sz:1.05}};
const PERS=['あまえんぼ','やんちゃ','おっとり','ビビり'],PSPD={'やんちゃ':1.3,'おっとり':.7};
const KIND={letter:{e:'💌',l:'手紙',p:'お手紙'},ball:{e:'⚽',l:'ボール',p:'ボール'},bone:{e:'🦴',l:'ほね',p:'大事な骨'},gift:{e:'🌰',l:'まつぼっくり',p:'松ぼっくり'}};
const OBJ={tree1:{x:.18,y:.24,e:'🌳',l:'木かげ'},tree2:{x:.82,y:.2,e:'🌳',l:'木かげ'},bowl:{x:.5,y:.8,e:'🍖',l:'ごはん場'},ball:{x:.15,y:.76,e:'⚽',l:'ボール'},bone:{x:.78,y:.7,e:'🦴',l:'ほね'}};
const MOOD={happy:'ごきげん',hungry:'おなかすいた',sleepy:'ねむい',lonely:'さみしい'};
const STAT=[['hunger','お腹','#FF9A3C'],['mood','ごきげん','#F472B6'],['energy','元気','#34D399'],['clean','キレイ','#60A5FA'],['aff','なつき','#FBBF24']];
let log=[],seen=new Set(),S={dogs:{},letters:[]},view={},sel=null,draft={breed:'柴犬',pers:'やんちゃ',name:''},mail={kind:'letter',text:''},readAt=0;
try{readAt=+localStorage.getItem(demoMode?'dr-demo-read':'dr-read')||0}catch{}

// ---- イベントソーシング: ステータスは時刻から決定的に計算 ----
const cl=v=>Math.max(0,Math.min(100,v));
function adv(v,t0,t1,park){const h=Math.max(0,(t1-t0)/36e5);return{hunger:cl(v.hunger-6*h),mood:cl(v.mood-3*h-(v.hunger<20?3*h:0)),energy:cl(v.energy+(park?-8:10)*h),clean:cl(v.clean-1.5*h),aff:cl(v.aff-.5*h)}}
function apply(d,t,delta){d.v=adv(d.v,d.t,t,d.inPark);d.t=t;for(const k in delta)d.v[k]=cl(d.v[k]+delta[k])}
const cur=d=>adv(d.v,d.t,Date.now(),d.inPark),lv=d=>1+Math.floor(d.xp/100);
function send(p,info){p.t=Date.now();p.k=me+uid();p.o=me;W.sendUpdate({payload:p,info},'')}
function build(){
  const s={dogs:{},letters:[]};
  for(const e of log.slice().sort((a,b)=>a.t-b.t||(a.k<b.k?-1:1))){
    if(e.a==='restore'){
      try{const b=checkBackup(e.backup);for(const x of b.dogs){if(!s.dogs[x.id]&&Object.values(s.dogs).filter(d=>d.owner===e.o).length<3)s.dogs[x.id]={...x,owner:e.o,oname:e.on};}
      for(const l of b.letters)if(!s.letters.some(x=>x.k===l.k))s.letters.push(l);}catch{}
      continue;
    }
    const d=s.dogs[e.id];
    if(e.a==='adopt'){if(!d&&Object.values(s.dogs).filter(x=>x.owner===e.o).length<3)
      s.dogs[e.id]={id:e.id,name:e.name,breed:e.breed,pers:e.pers,owner:e.o,oname:e.on,born:e.t,inPark:true,v:{hunger:80,mood:80,energy:90,clean:90,aff:30},t:e.t,xp:0}}
    else if(!d&&e.a!=='mail')continue;
    else if(e.a==='feed'){apply(d,e.t,{hunger:40,energy:10});d.xp+=4}
    else if(e.a==='pat'){const own=e.o===d.owner;apply(d,e.t,{aff:own?6:2,mood:own?16:8});d.xp+=own?3:2}
    else if(e.a==='brush'&&e.o===d.owner){apply(d,e.t,{clean:45,mood:6});d.xp+=5}
    else if(e.a==='ball'){apply(d,e.t,{energy:-18,mood:25});d.xp+=12}
    else if(e.a==='park'&&e.o===d.owner){apply(d,e.t,{});d.inPark=!!e.v}
    else if(e.a==='mail'){const f=s.dogs[e.from];if(f&&f.owner===e.o&&s.dogs[e.to]){s.letters.push(e);apply(f,e.t,{mood:5});f.xp+=6}}
  }
  S=s;
}
const mine=()=>Object.values(S.dogs).filter(d=>d.owner===me);
const inbox=()=>S.letters.filter(l=>S.dogs[l.to]?.owner===me&&S.dogs[l.from]);
const moodOf=(d,sl)=>{if(sl)return'sleepy';const v=cur(d);return v.hunger<30?'hungry':v.energy<20?'sleepy':v.mood<30?'lonely':'happy'};

// ---- 2頭身の犬 (SVG) ----
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>'#'+hx(a).map((v,i)=>Math.round(v+(hx(b)[i]-v)*t).toString(16).padStart(2,'0')).join('');
let gid=0;
function art(br,m){
  const B_=BR[br]||BR['柴犬'],col=B_.col,id='g'+(++gid),lt=mix(col,'#ffffff',.45),dk=mix(col,'#000000',.22),bel=mix(col,'#ffffff',.7),ink='#17101f',pink='#ff9fb0',earc=B_.ec||mix(col,'#5a3a22',.45);
  const H=`url(#${id}h)`,B=`url(#${id}b)`;
  const defs=`<defs><radialGradient id="${id}h" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="${lt}"/><stop offset=".55" stop-color="${col}"/><stop offset="1" stop-color="${dk}"/></radialGradient><radialGradient id="${id}b" cx=".4" cy=".25" r=".9"><stop offset="0" stop-color="${col}"/><stop offset="1" stop-color="${dk}"/></radialGradient></defs>`;
  const tail={curl:`<path d="M76 106q22-2 18-24q-3-10-12-4" stroke="${col}" stroke-width="11" fill="none" stroke-linecap="round"/><path d="M82 78q10-2 11 6" stroke="${bel}" stroke-width="5" fill="none" stroke-linecap="round"/>`,
    stub:`<circle cx="82" cy="110" r="6" fill="${col}"/>`,long:`<path d="M78 108q24 2 28-22" stroke="${col}" stroke-width="7" fill="none" stroke-linecap="round"/>`,
    plume:`<path d="M78 106q20-10 14-32" stroke="${col}" stroke-width="14" fill="none" stroke-linecap="round"/><circle cx="91" cy="76" r="9" fill="${bel}"/>`,
    otter:`<path d="M78 108q20 4 26-6" stroke="${col}" stroke-width="11" fill="none" stroke-linecap="round"/>`}[B_.tail];
  const tri=(a,b,c,x,y)=>`<g class="ear" style="transform-origin:${x}px ${y}px"><path d="${a}" fill="${col}"/><path d="${b}" fill="${mix(col,pink,.55)}"/></g><g class="ear" style="transform-origin:${120-x}px ${y}px"><path d="${c}" fill="${col}"/></g>`;

// ---- 公園: 犬が走り回り、操作に反応し、お届け物を運ぶ ----
const dogs=new Map(),calm=matchMedia('(prefers-reduced-motion:reduce)').matches,objEls={};
let ready=false;
for(const[k,o]of Object.entries(OBJ)){const e=document.createElement('div');e.className='obj';e.style.left=o.x*100+'%';e.style.top=o.y*100+'%';e.innerHTML=o.e+'<small>'+o.l+'</small>';$('#park').append(e);objEls[k]=e}
function setArt(o){const m=moodOf(o.p,o.sleeping),sig=o.p.breed+m;if(o.sig!==sig){o.sig=sig;o.hop.innerHTML=art(o.p.breed,m)}}
function sync(){
  const park=$('#park'),rw=park.clientWidth||320,rh=park.clientHeight||360;
  for(const p of Object.values(S.dogs)){
    let o=dogs.get(p.id);
    if(!p.inPark){if(o){o.el.remove();dogs.delete(p.id)}continue}
    if(!o){
      const el=document.createElement('div');el.className='pet';el.dataset.a='sel';el.dataset.v=p.id;
      el.innerHTML='<div class="shadow"></div><div class="flip"><div class="act"><div class="hop"></div></div></div><div class="bub"></div><div class="speech" hidden></div><div class="tag"></div><b class="badge" hidden></b>';
      park.append(el);
      o={el,flip:el.querySelector('.flip'),hop:el.querySelector('.hop'),bub:el.querySelector('.bub'),sp:el.querySelector('.speech'),tag:el.querySelector('.tag'),bd:el.querySelector('.badge'),
        x:rw*(ready?.5:.1+rnd()*.8),y:rh*(ready?.95:.25+rnd()*.65),wait:rnd()*3,dir:1,s:1,st:'idle'};
      dogs.set(p.id,o);
    }
    o.p=p;setArt(o);
    o.tag.innerHTML=`${esc(p.name)} <small>Lv.${lv(p)}</small>`;
    o.el.classList.toggle('mine',p.owner===me);o.el.classList.toggle('sel',sel===p.id);
    const n=inbox().filter(l=>l.to===p.id&&l.t>readAt).length;o.bd.hidden=!n;o.bd.textContent='✉'+n;
  }
  for(const[id,o]of dogs)if(!S.dogs[id]){o.el.remove();dogs.delete(id)}
}
const say=(o,t,ms=3000)=>{o.speech=t;o.su=performance.now()+ms};
function decide(o,rw,rh){
  const d=cur(o.p),pr=o.p.pers,r=rnd(),others=[...dogs.values()].filter(x=>x!==o);
  const at=(k,dx=0)=>({x:OBJ[k].x*rw+dx,y:OBJ[k].y*rh+18});
  let t,st='sniff';
  if(d.hunger<30){t=at('bowl',(rnd()-.5)*50);say(o,'おなかすいた…',2500)}
  else if(d.energy<20){t=at(rnd()<.5?'tree1':'tree2',(rnd()-.5)*40);st='sleep';say(o,'ねむい…💤',2500)}
  else if(pr==='あまえんぼ'&&others.length&&r<.5){const f=others[rnd()*others.length|0];t={x:f.x+(rnd()-.5)*70,y:f.y+(rnd()-.5)*20};st='run'}
  else if(pr==='ビビり'&&r<.6){t=at(rnd()<.5?'tree1':'tree2',(rnd()-.5)*80)}
  else if(pr==='やんちゃ'&&r<.4){t=at(rnd()<.5?'ball':'bone',(rnd()-.5)*40);st=rnd()<.6?'run':'play'}
  else{t={x:rw*(.1+rnd()*.8),y:rh*(.25+rnd()*.67)};st=rnd()<.55?'run':'sniff'}
  o.tx=t.x;o.ty=t.y;o.st=st;
  if(rnd()<.15&&!o.speech)say(o,{run:'わんわん！',sniff:'くんくん…',play:'あそぼ！',sleep:'ふぁ…'}[st]||'はぁはぁ',2200);
}
let last=performance.now();
function tick(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const park=$('#park'),rw=park.clientWidth,rh=park.clientHeight,x0=rw*.08,x1=rw*.92,y0=rh*.2,y1=rh*.92;
  for(const[k,e]of Object.entries(objEls))e.style.zIndex=Math.round(OBJ[k].y*rh);
  for(const o of dogs.values()){
    let tx=null,ty=0,spd=0,moving=false;
    const k=o.task;
    if(k&&now>k.until)o.task=null;
    if(o.task){const g=o.task.get();if(g){tx=g.x;ty=g.y;spd=o.task.spd}else o.task=null}
    else if(o.sleeping){if((o.wait-=dt)<=0){o.sleeping=false;setArt(o);o.wait=2}}
    else if(!calm){
      if(o.tx==null&&(o.wait-=dt)<=0)decide(o,rw,rh);
      if(o.tx!=null){tx=o.tx;ty=o.ty;spd={run:75,play:55,sniff:26,sleep:40}[o.st]*(PSPD[o.p.pers]||1)}
    }
    if(tx!=null){
      const dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy);
      if(d<5){
        if(o.task){const f=o.task.then;o.task=null;f&&f()}
        else{o.tx=null;if(o.st==='sleep'){o.sleeping=true;o.wait=18+rnd()*14;setArt(o)}else o.wait=1+rnd()*4}
      }else{const st=Math.min(d,spd*dt);o.x+=dx/d*st;o.y+=dy/d*st;moving=true;if(Math.abs(dx)>3)o.dir=dx>0?1:-1}
    }
    o.x=Math.max(x0*.5,Math.min(rw-x0*.5,o.x));o.y=Math.max(y0,Math.min(y1,o.y));
    o.s=(.7+.5*(o.y-y0)/Math.max(1,y1-y0))*(BR[o.p.breed]?.sz||1);
    o.el.style.transform=`translate(${o.x}px,${o.y}px) translate(-50%,-100%) scale(${o.s})`;
    o.el.style.zIndex=Math.round(o.y);
    o.el.classList.toggle('walk',moving);o.el.classList.toggle('run',moving&&(o.task||o.st==='run'));
    o.flip.style.transform=`scaleX(${o.dir})`;
    const sp=o.su>now?o.speech:'';if(o.sp.textContent!==sp){o.sp.textContent=sp;o.sp.hidden=!sp}
    const b=o.task&&o.task.item||(!o.sleeping&&cur(o.p).hunger<30?'🍖':'');if(o.bub.textContent!==b)o.bub.textContent=b;
  }
  requestAnimationFrame(tick);
}
function spawn(o,txt,cls,n=1){for(let i=0;i<n;i++){const e=document.createElement('span');e.className='fx '+cls;e.textContent=txt;
  e.style.left=(o.x+(rnd()-.5)*(n>1?60:10))+'px';e.style.top=(o.y-100*o.s-rnd()*14)+'px';e.style.animationDelay=(i*.12)+'s';
  e.onanimationend=()=>e.remove();$('#park').append(e)}}
function act(o,c,ms){o.el.classList.add(c);setTimeout(()=>o.el.classList.remove(c),ms)}
function react(e){
  const o=dogs.get(e.id),own=o&&o.p.owner===e.o;
  if(e.a==='feed'&&o){say(o,'もぐもぐ！おいしい！');spawn(o,['🍖','🥩','🍗'][rnd()*3|0],'drop');setTimeout(()=>act(o,'eat',1500),700);setTimeout(()=>spawn(o,'❤️','heart',3),1500)}
  else if(e.a==='pat'&&o){say(o,own?'くぅ〜ん…💕':'わん！なでなで嬉しい！');act(o,'squish',700);spawn(o,'❤️','heart',5)}
  else if(e.a==='brush'&&o){say(o,'さらさら〜✨');act(o,'squish',700);spawn(o,'✨','heart',5)}
  else if(e.a==='ball'&&o){say(o,'いくよ！！');const b=objEls.ball.getBoundingClientRect(),p=$('#park').getBoundingClientRect();
    o.task={get:()=>({x:OBJ.ball.x*$('#park').clientWidth,y:OBJ.ball.y*$('#park').clientHeight+18}),spd:110,until:performance.now()+12e3,item:'',then:()=>{spawn(o,'⚽','pop');act(o,'jump',800);setTimeout(()=>spawn(o,'❤️','heart',2),500)}};o.tx=null}
  else if(e.a==='park'&&o&&e.v)say(o,'いってきまーす！');
  else if(e.a==='adopt'&&o){say(o,'よろしくね！');spawn(o,'❤️','heart',4)}
  else if(e.a==='mail'){const f=dogs.get(e.from),t=dogs.get(e.to),it=KIND[e.kind].e;
    if(f&&t&&f!==t){say(f,'お届けだワン！');f.task={get:()=>dogs.has(e.to)?{x:t.x-34*(Math.sign(t.x-f.x)||1),y:t.y}:null,spd:110,until:performance.now()+25e3,item:it,then:()=>{spawn(t,it,'pop');act(t,'jump',800);say(t,'わん！ありがと！');spawn(t,'❤️','heart',2)}};f.tx=null;f.sleeping=false}
    else if(t){spawn(t,it,'pop');act(t,'jump',800)}}
}

    h=ms.length?`<h2>${esc(t.name)}へお届け</h2><label>運ぶ犬<select id="from">${ms.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><div class="pick">${Object.entries(KIND).map(([k,o])=>`<button class="opt${mail.kind===k?' on':''}" data-a="kind" data-v="${k}"><span style="font-size:1.6rem">${o.e}</span><br>${o.l}</button>`).join('')}</div><textarea id="txt" maxlength="300" rows="4" placeholder="${mail.kind==='letter'?esc(t.oname)+'さんへのメッセージ':'ひとこと(なくてもOK)'}">${esc(mail.text)}</textarea><div class="row"><button data-a="post" data-v="${t.id}">届けてもらう</button><button class="ghost" data-a="close">キャンセル</button></div>`
      :`<p>お届けには、先に自分の犬を迎えてください。</p><div class="row"><button data-a="adopt">迎える</button><button class="ghost" data-a="close">閉じる</button></div>`;
  }else if(v.k==='inbox'){
    const ls=inbox().sort((a,b)=>b.t-a.t).slice(0,30);
    h=`<h2>届いたお手紙・お届け物</h2>`+(ls.length?ls.map(l=>{const f=S.dogs[l.from],t=S.dogs[l.to],K=KIND[l.kind];
      return`<div class="air"><div class="from">${art(f.breed,'happy')}<small>${esc(f.name)}（${esc(l.on)}）が${K.p}を${esc(t.name)}のところへ届けにきたよ ${K.e}</small></div>${l.text?`<p>${esc(l.text)}</p>`:''}<small class="sub">${new Date(l.t).toLocaleString('ja-JP')}</small></div>`}).join('')
      :'<p class="sub">まだ届いていません。</p>')+`<div class="row"><button class="ghost" data-a="close">閉じる</button></div>`;
  }
  dlg.innerHTML=h;
}

const BACKUP_FORMAT='dogrun-personal-backup';let pendingBackup=null;
function checkBackup(b){
 const fail=()=>{throw Error('ドッグランの引き継ぎデータではないか、内容が壊れています。')};
 if(!b||b.format!==BACKUP_FORMAT||b.schema!==1||!Array.isArray(b.dogs)||!Array.isArray(b.letters)||b.dogs.length>3||b.letters.length>500)fail();
 const str=(x,n)=>typeof x==='string'&&x.length>0&&x.length<=n;
 const num=(x,min,max)=>Number.isFinite(x)&&x>=min&&x<=max;
 const ids=new Set();
 const ds=b.dogs.map(d=>{if(!d||!str(d.id,100)||!/^[a-zA-Z0-9_-]+$/.test(d.id)||ids.has(d.id)||!str(d.name,12)||!Object.hasOwn(BR,d.breed)||!PERS.includes(d.pers)||typeof d.inPark!=='boolean'||!num(d.born,0,1e15)||!num(d.t,0,1e15)||!num(d.xp,0,1e9)||!d.v||!STAT.every(([k])=>num(d.v[k],0,100)))fail();ids.add(d.id);return {id:d.id,name:d.name,breed:d.breed,pers:d.pers,born:d.born,inPark:d.inPark,v:Object.fromEntries(STAT.map(([k])=>[k,d.v[k]])),t:d.t,xp:d.xp}});
 const ls=b.letters.map(l=>{if(!l||!str(l.k,200)||!str(l.from,100)||!str(l.to,100)||(!ids.has(l.from)&&!ids.has(l.to))||!Object.hasOwn(KIND,l.kind)||typeof l.text!=='string'||l.text.length>300||!str(l.on,200)||!num(l.t,0,1e15))fail();return {a:'mail',k:l.k,from:l.from,to:l.to,kind:l.kind,text:l.text,on:l.on,t:l.t}});
 return {format:BACKUP_FORMAT,schema:1,appVersion:'1.1.1',dogs:ds,letters:ls};
}
function makeBackup(){const ds=mine(),ids=new Set(ds.map(d=>d.id));const b=checkBackup({format:BACKUP_FORMAT,schema:1,dogs:ds,letters:S.letters.filter(l=>ids.has(l.from)||ids.has(l.to)).sort((a,b)=>a.t-b.t).slice(-500)});const cap=Math.min(W.sendUpdateMaxSize||128000,120000)-4000;while(b.letters.length&&new TextEncoder().encode(JSON.stringify(b)).length>cap)b.letters.shift();return b}
function checkRestore(b){
 if(!b.dogs.length)throw Error('引き継ぐ犬がありません。');
 if(b.dogs.some(d=>S.dogs[d.id]&&S.dogs[d.id].owner!==me))throw Error('この犬は別の参加者が登録済みです。自分のデータを選んでください。');
 if(new Set([...mine().map(d=>d.id),...b.dogs.map(d=>d.id)]).size>3)throw Error('引き継ぐと自分の犬が3頭を超えます。犬を迎える前の新しい投稿で読み込んでください。');
 const bytes=new TextEncoder().encode(JSON.stringify({payload:{a:'restore',backup:b,o:me,on:myName,k:'x'.repeat(200),t:Date.now()}})).length;
 if(bytes>Math.min(W.sendUpdateMaxSize||128000,120000))throw Error('データが大きすぎます。お届けの記録を減らしてから読み込んでください。');
}
function backupMessage(e){const el=$('#backupMessage');if(el)el.textContent=e.message||String(e)}
document.addEventListener('change',async e=>{if(e.target.id==='backupFile'){try{const f=e.target.files[0];if(!f)return;if(f.size>250000)throw Error('ファイルが大きすぎます。');$('#backupText').value=await f.text();}catch(err){backupMessage(err)}}});

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,v=b.dataset.v,d=S.dogs[v];
  switch(a){
    case'backup':return show({k:'backup'});
    case'export':return show({k:'export'});
    case'selectBackup':$('#exportText').focus();$('#exportText').select();return;
    case'saveBackup':if(!W.sendToChat)return backupMessage('この端末では保存を使えません。全文を選択してコピーしてください。');return W.sendToChat({file:{name:'dogrun-backup-1.1.1.json',plainText:$('#exportText').value},text:'ドッグランの引き継ぎデータ'}).catch(backupMessage);
    case'preview':try{pendingBackup=checkBackup(JSON.parse($('#backupText').value));checkRestore(pendingBackup);show({k:'restorePreview'});}catch(err){backupMessage(err)}return;
    case'restoreNow':try{checkRestore(pendingBackup);send({a:'restore',backup:pendingBackup,on:myName},myName+'が犬を引き継ぎました');show({k:'restored'});}catch(err){backupMessage(err)}return;
    case'sel':sel=v;return render();
    case'close':return dlg.close();
    case'inbox':readAt=Date.now();try{localStorage.setItem(demoMode?'dr-demo-read':'dr-read',readAt)}catch{}show({k:'inbox'});return render();
    case'adopt':return show({k:'adopt'});
    case'br':case'pr':draft.name=$('#nm').value;draft[a==='br'?'breed':'pers']=v;return modal();
    case'adoptgo':{const name=$('#nm').value.trim();if(!name)return $('#nm').focus();dlg.close();draft.name='';
      return send({a:'adopt',id:uid(),name,breed:draft.breed,pers:draft.pers,on:myName},`${myName}の新入り：${name}（${draft.breed}）`)}
    case'feed':return send({a:'feed',id:v},`${myName}が${d.name}におやつをあげた`);
    case'pat':return send({a:'pat',id:v},`${myName}が${d.name}をなでなで`);
    case'brush':return send({a:'brush',id:v},`${myName}が${d.name}をブラッシング`);
    case'ball':return send({a:'ball',id:v},`${myName}が${d.name}とボール遊び`);
    case'park':return send({a:'park',id:v,v:!d.inPark},`${d.name}が${d.inPark?'おうちに帰った':'ランに来た'}`);
    case'write':mail={kind:'letter',text:''};return show({k:'write',id:v});
    case'kind':mail.text=$('#txt').value;mail.kind=v;return modal();
    case'post':{const text=$('#txt').value.trim();if(mail.kind==='letter'&&!text)return $('#txt').focus();const from=$('#from').value;dlg.close();
      return send({a:'mail',from,to:v,kind:mail.kind,text,on:myName},`${S.dogs[from].name}が${KIND[mail.kind].p}を${d.name}へ届けた`)}
  }
});
setInterval(render,10000);
W.setUpdateListener(u=>{
  const e=u.payload,fresh=e&&e.k&&!seen.has(e.k);
  if(fresh){seen.add(e.k);log.push(e)}
  if(!u.max_serial||u.serial===u.max_serial){build();render()}
  if(ready&&fresh&&Date.now()-e.t<12e4)setTimeout(()=>react(e),60);
},0).then(()=>{ready=true;build();render();connectionError(demoMode?'ブラウザーデモ ・ 別端末やDelta Chatには共有されません。'+(demoPersistent?'操作内容はこのブラウザーに保存します。':'保存が使えないため、この画面を閉じると操作内容が消えます。'):'チャット共有モード ・ 同じ投稿から参加してください');}).catch(()=>connectionError('共有データを読み込めませんでした。アプリを閉じて、同じ投稿から開き直してください。'));
build();render();requestAnimationFrame(tick);
</script></body></html>
